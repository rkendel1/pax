[build-system]
requires = ["hatchling>=1.20", "wheel"]
build-backend = "hatchling.build"

[project]
name = "svc"
version = "0.1.0"
dependencies = [
  "requests>=2.31",
  "httpx[http2]==0.27.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[dependency-groups]
lint = ["ruff>=0.5"]
docs = ["mkdocs"]
